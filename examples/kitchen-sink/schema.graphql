"""
The root of the kitchen-sink API.
"""
type Query {
  """
  The currently authenticated user.
  """
  viewer: User!
  """
  Loads any object by its globally unique identifier.
  """
  node(
    """
    The globally unique identifier to load.
    """
    id: ID!
  ): Node
  search(filter: PostFilter, first: Int, after: String): SearchResultConnection!
  stats: ViewerStats!
  largeObject: LargeObject!
}

type UpdatePostPayload {
  post: Post
  errors: [String!]!
}

type Mutation {
  updatePost(input: UpdatePostInput!): UpdatePostPayload!
}
