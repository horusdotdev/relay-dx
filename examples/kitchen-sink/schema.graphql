"""
The complete Relay kitchen-sink API schema.
"""
schema {
  query: Query
  mutation: Mutation
}

"""
An ISO-8601 timestamp returned by the API.
"""
scalar DateTime

"""
An absolute URL.
"""
scalar URL

"""
Optional presentation metadata for a field.
"""
directive @displayLabel(
  """
  Human-readable label shown by clients.
  """
  label: String
) on FIELD_DEFINITION

"""
Objects with stable global identity.
"""
interface Node {
  """
  A globally unique identifier.
  """
  id: ID!
}

"""
The permission level assigned to a user.
"""
enum UserRole {
  """
  Can manage all content and settings.
  """
  ADMIN
  EDITOR
  VIEWER
}

"""
The publication lifecycle of a post.
"""
enum PostStatus {
  DRAFT
  """
  Visible to readers in the public feed.
  """
  PUBLISHED
  ARCHIVED
}

"""
Optional predicates used when searching posts.
"""
input PostFilter {
  """
  Matches words in the title or body.
  """
  text: String
  statuses: [PostStatus!]
  authorId: ID
}

input UpdatePostInput {
  id: ID!
  title: String!
  status: PostStatus
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

"""
A person who can author and edit content.
Supports Unicode: café, 東京, and “smart quotes”; quoted text: "viewer".
"""
type User implements Node {
  id: ID!
  """
  The display name shown in feeds.
  """
  name: String! @displayLabel(label: "Display name")
  role: UserRole!
  avatar: URL
  email: String @deprecated(reason: "Use the private contact endpoint instead.")
  posts(first: Int, after: String): PostConnection!
}

type Post implements Node {
  id: ID!
  title: String!
  body: String!
  status: PostStatus!
  publishedAt: DateTime
  author: User!
  tags: [String!]!
}

"""
A search hit, which may be a user or a post.
"""
union SearchResult = User | Post

type SearchResultEdge {
  cursor: String!
  node: SearchResult!
}

type SearchResultConnection {
  edges: [SearchResultEdge!]!
  pageInfo: PageInfo!
}

type PostEdge {
  cursor: String!
  node: Post
}

type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
}

type ViewerStats {
  postCount: Int!
  unreadCount: Int!
}

