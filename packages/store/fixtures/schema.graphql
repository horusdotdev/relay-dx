scalar URL
scalar JSON
directive @semanticNonNull(levels: [Int] = [0]) on FIELD_DEFINITION
enum Status {
  DRAFT
  PUBLISHED
}
input Filter {
  status: Status
  nested: NestedFilter
}
input NestedFilter {
  term: String
  limit: Int
}
interface Node {
  id: ID!
}
interface HasPosts {
  posts(filter: Filter, first: Int, after: String): PostConnection!
}
type User implements Node & HasPosts {
  getType: String
  getDataID: String
  as: String
  connections: String
  constructor: String
  fields: String
  scope: String
  then: String
  id: ID!
  name: String!
  avatar: URL
  opaque: JSON
  friend: User
  friends: [User!]!
  tags: [String!]!
  posts(filter: Filter, first: Int, after: String): PostConnection!
  archivedPosts(filter: Filter, first: Int, after: String): PostConnection!
}
type Post implements Node {
  id: ID!
  title: String!
  author: User!
  body: String!
}
type CreationFixture {
  id: ID!
  title: String!
  semantic: String @semanticNonNull
  items: [String] @semanticNonNull(levels: [1])
  strictItems: [String] @semanticNonNull(levels: [0, 1])
  nested: [[Int]] @semanticNonNull(levels: [0, 2])
  optional: String
  conditional: String!
  requiredLabel: String
  argumented(locale: String!): String!
  unselected: String!
}
type PostEdge {
  cursor: String!
  node: Post
}
type PostConnection {
  edges: [PostEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}
type Group implements Node {
  id: ID!
  items(filter: Filter, first: Int, after: String): PostConnection!
}
type Query {
  viewer: User!
  group(id: ID!): Group
  node(id: ID!): Node
  recentNodes(limit: Int): [Node]
  requiredNodes(input: Filter!): [Node]
  count(input: Filter!, scale: Int! = 2, label: String): Int!
}
